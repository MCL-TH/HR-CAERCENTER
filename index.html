<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR C❤️RE CENTER - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --maersk-blue: #42B0D5; 
            --maersk-dark-blue: #007EB3;
            --maersk-dark: #1E1E1E; 
            --brand-red: #FF4D4D;
        }
        body { font-family: 'Kanit', sans-serif; background-color: #f0f4f8; }
        .brand-title { font-family: 'Inter', sans-serif; font-weight: 900; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background: white; box-shadow: 0 0 50px rgba(0,0,0,0.1); }
        .step-transition { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .admin-card { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); color: white; border-radius: 24px; }
        .input-field { width: 100%; padding: 12px 20px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px; outline: none; transition: all 0.2s; font-weight: 500; }
        .input-field:focus { border-color: var(--maersk-blue); background: white; }
    </style>
</head>
<body>

    <div class="app-container flex flex-col relative min-h-screen">
        <!-- Navbar -->
        <header class="p-6 flex justify-between items-center bg-white border-b sticky top-0 z-50">
            <div class="flex flex-col">
                <h1 class="brand-title text-xl text-slate-800 leading-none">HR C<span class="text-brand-red">❤️</span>RE CENTER</h1>
                <span class="text-[9px] font-bold text-sky-500 uppercase tracking-widest mt-1">Management Portal</span>
            </div>
            <button onclick="toggleAdminView()" id="admin-btn" class="hidden w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-sky-100 hover:text-sky-600 transition-colors">
                <i class="fa-solid fa-user-gear"></i>
            </button>
        </header>

        <main class="flex-grow p-6">
            
            <!-- VIEW: LOGIN -->
            <section id="view-login" class="step-transition py-10 flex flex-col items-center">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-slate-800">ลงชื่อเข้าใช้งาน</h2>
                    <p class="text-slate-400 text-sm">ระบุรหัสพนักงานเพื่อเริ่มต้น</p>
                </div>
                <input type="text" id="emp-id-input" maxlength="7" placeholder="Employee ID" class="input-field text-center text-2xl tracking-widest mb-4">
                <button onclick="handleLogin()" class="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform">
                    เข้าสู่ระบบ
                </button>
                <p class="mt-6 text-[10px] text-slate-300 uppercase tracking-widest font-bold">Admin ID: 1000000</p>
            </section>

            <!-- VIEW: ADMIN DASHBOARD -->
            <section id="view-admin" class="hidden step-transition space-y-6">
                <div class="admin-card p-6 shadow-xl">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-xs font-bold uppercase opacity-60">Superuser Dashboard</span>
                        <i class="fa-solid fa-shield-check text-sky-400"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-1" id="admin-name">Administrator</h3>
                    <p class="text-sm opacity-70">คุณสามารถจัดการข้อมูลพนักงานและดูผลตอบรับได้ที่นี่</p>
                </div>

                <!-- Tabs -->
                <div class="flex gap-2 p-1 bg-slate-100 rounded-2xl">
                    <button onclick="switchTab('add')" id="tab-add" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all bg-white shadow-sm text-slate-800">เพิ่มพนักงาน</button>
                    <button onclick="switchTab('list')" id="tab-list" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all text-slate-500">รายชื่อ/ผลสรุป</button>
                </div>

                <!-- Tab: Add Employee -->
                <div id="content-add" class="space-y-4">
                    <div class="bg-white p-5 border rounded-3xl space-y-3">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">Employee ID (7 Digits)</label>
                            <input type="text" id="add-id" maxlength="7" class="input-field" placeholder="เช่น 1008221">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">Full Name</label>
                            <input type="text" id="add-name" class="input-field" placeholder="ชื่อ - นามสกุล">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">Department</label>
                                <input type="text" id="add-dept" class="input-field" placeholder="แผนก">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">Position</label>
                                <input type="text" id="add-pos" class="input-field" placeholder="ตำแหน่ง">
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">Status</label>
                            <select id="add-status" class="input-field">
                                <option value="Active">Active</option>
                                <option value="Probation">Probation</option>
                                <option value="Contract">Contract</option>
                            </select>
                        </div>
                        <button onclick="addEmployee()" class="w-full bg-sky-500 text-white font-bold py-4 rounded-2xl mt-4 shadow-lg shadow-sky-100 active:scale-95 transition-all">
                            บันทึกข้อมูลพนักงาน
                        </button>
                    </div>
                </div>

                <!-- Tab: List -->
                <div id="content-list" class="hidden space-y-4">
                    <div id="admin-stats" class="grid grid-cols-2 gap-3"></div>
                    <div id="employee-list" class="space-y-2">
                        <!-- Employee items will be injected here -->
                    </div>
                </div>

                <button onclick="location.reload()" class="w-full py-4 text-[10px] font-bold text-slate-300 uppercase tracking-widest text-center">Logout Admin</button>
            </section>

            <!-- VIEW: USER DASHBOARD (For non-admin) -->
            <section id="view-dashboard" class="hidden step-transition">
                <div class="bg-sky-500 text-white p-8 rounded-[2rem] mb-6">
                    <h2 id="user-display-name" class="text-2xl font-bold">สวัสดีครับ</h2>
                    <p id="user-display-id" class="opacity-80 text-sm"></p>
                </div>
                <div class="bg-white border rounded-3xl p-6 shadow-sm mb-4">
                    <h4 class="text-xs font-bold text-slate-400 uppercase mb-4">สถานะข้อมูล</h4>
                    <div class="flex justify-between items-center border-b pb-3 mb-3">
                        <span class="text-sm font-medium">ขนาดเสื้อ</span>
                        <span id="user-shirt" class="font-bold text-sky-600">ยังไม่ระบุ</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-medium">ขนาดรองเท้า</span>
                        <span id="user-shoe" class="font-bold text-sky-600">ยังไม่ระบุ</span>
                    </div>
                </div>
                <button onclick="location.reload()" class="w-full py-4 text-xs font-bold text-slate-400 text-center uppercase tracking-widest">Logout</button>
            </section>

        </main>

        <footer class="p-8 text-center text-[10px] font-bold text-slate-300 uppercase tracking-[0.4em]">
            HR C❤️RE CENTER v2.0
        </footer>
    </div>

    <!-- Firebase App (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCWhf-BRWNMk5C6QzCUJbVVwGgUK9mnMoU",
            authDomain: "hr-carecenter.firebaseapp.com",
            projectId: "hr-carecenter",
            storageBucket: "hr-carecenter.firebasestorage.app",
            messagingSenderId: "935576170295",
            appId: "1:935576170295:web:a30e4a6d50eb0b4ff4f4b2"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const APP_ID = 'maersk-prod-v2';
        const ADMIN_IDS = ['1000000', '1008221']; // รายชื่อ Superuser

        let currentUser = null;

        async function handleLogin() {
            const id = document.getElementById('emp-id-input').value.trim();
            if (id.length < 5) {
                Swal.fire('Error', 'กรุณาระบุรหัสพนักงานให้ถูกต้อง', 'error');
                return;
            }

            Swal.fire({ title: 'กำลังโหลด...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                await auth.signInAnonymously();
                
                // ตรวจสอบว่าเป็น Superuser หรือไม่ก่อนเช็คฐานข้อมูล
                if (ADMIN_IDS.includes(id)) {
                    const empDoc = await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('employees').doc(id).get();
                    
                    if (empDoc.exists) {
                        currentUser = { id: id, ...empDoc.data() };
                    } else {
                        // ถ้าเป็น Superuser แต่ยังไม่มีข้อมูลใน DB ให้สร้าง Object ชั่วคราวเพื่อให้เข้าหน้า Admin ได้
                        currentUser = { id: id, name: 'System Administrator' };
                    }
                    
                    showAdminDashboard();
                    Swal.close();
                    return;
                }

                // กรณีพนักงานทั่วไป ต้องมีข้อมูลในฐานข้อมูลเท่านั้น
                const empDoc = await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('employees').doc(id).get();

                if (empDoc.exists) {
                    currentUser = { id: id, ...empDoc.data() };
                    showUserDashboard();
                    Swal.close();
                } else {
                    Swal.fire('ไม่พบข้อมูล', 'ไม่พบรายชื่อพนักงานนี้ในระบบ กรุณาติดต่อ HR', 'error');
                }
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            }
        }

        function showAdminDashboard() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-admin').classList.remove('hidden');
            document.getElementById('admin-btn').classList.remove('hidden');
            document.getElementById('admin-name').innerText = currentUser.name || 'Administrator';
            loadEmployeeList();
        }

        function showUserDashboard() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = `สวัสดีครับ, ${currentUser.name}`;
            document.getElementById('user-display-id').innerText = `Employee ID: ${currentUser.id}`;
            document.getElementById('user-shirt').innerText = currentUser.shirtSize || 'ยังไม่ระบุ';
            document.getElementById('user-shoe').innerText = currentUser.shoeSize ? currentUser.shoeSize + ' EU' : 'ยังไม่ระบุ';
        }

        async function addEmployee() {
            const id = document.getElementById('add-id').value.trim();
            const name = document.getElementById('add-name').value.trim();
            const dept = document.getElementById('add-dept').value.trim();
            const pos = document.getElementById('add-pos').value.trim();
            const status = document.getElementById('add-status').value;

            if (!id || !name || !dept || !pos) {
                Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกข้อมูลให้ครบทุกช่อง', 'warning');
                return;
            }

            try {
                Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading() });
                
                await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('employees').doc(id).set({
                    name,
                    dept,
                    position: pos,
                    status,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                Swal.fire('สำเร็จ', `เพิ่มพนักงานรหัส ${id} เรียบร้อยแล้ว`, 'success');
                
                // ล้างข้อมูลในฟอร์ม
                document.getElementById('add-id').value = '';
                document.getElementById('add-name').value = '';
                document.getElementById('add-dept').value = '';
                document.getElementById('add-pos').value = '';
                loadEmployeeList(); // รีเฟรชรายการ
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            }
        }

        async function loadEmployeeList() {
            const listContainer = document.getElementById('employee-list');
            listContainer.innerHTML = '<p class="text-center text-slate-300 py-4 italic">Loading...</p>';
            
            try {
                const snap = await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('employees').get();
                let html = '';
                let responded = 0;

                snap.forEach(doc => {
                    const d = doc.data();
                    if (d.shirtSize) responded++;
                    html += `
                        <div class="bg-white p-4 border rounded-2xl flex justify-between items-center shadow-sm">
                            <div class="overflow-hidden mr-2">
                                <p class="text-xs font-bold text-slate-800 truncate">${d.name}</p>
                                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">${doc.id} • ${d.dept || '-'}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                ${d.shirtSize ? `<span class="text-[9px] bg-green-50 text-green-600 px-2 py-1 rounded-lg font-black">DONE</span>` : `<span class="text-[9px] bg-slate-50 text-slate-400 px-2 py-1 rounded-lg font-black">PENDING</span>`}
                                <button onclick="deleteEmployee('${doc.id}')" class="text-slate-200 hover:text-red-400 p-2"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('admin-stats').innerHTML = `
                    <div class="bg-slate-50 p-4 rounded-2xl text-center">
                        <p class="text-[8px] font-bold text-slate-400 uppercase">Responded</p>
                        <p class="text-xl font-black text-slate-800">${responded}</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl text-center">
                        <p class="text-[8px] font-bold text-slate-400 uppercase">Total Employees</p>
                        <p class="text-xl font-black text-slate-800">${snap.size}</p>
                    </div>
                `;
                listContainer.innerHTML = html || '<p class="text-center text-slate-300 py-10">No employees found.</p>';
            } catch (err) {
                listContainer.innerHTML = `<p class="text-red-400 text-center text-xs">${err.message}</p>`;
            }
        }

        async function deleteEmployee(id) {
            const result = await Swal.fire({
                title: 'ยืนยันการลบ?',
                text: `คุณกำลังจะลบพนักงานรหัส ${id}`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ลบข้อมูล'
            });

            if (result.isConfirmed) {
                await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('employees').doc(id).delete();
                loadEmployeeList();
            }
        }

        function switchTab(tab) {
            document.getElementById('content-add').classList.toggle('hidden', tab !== 'add');
            document.getElementById('content-list').classList.toggle('hidden', tab !== 'list');
            
            document.getElementById('tab-add').classList.toggle('bg-white', tab === 'add');
            document.getElementById('tab-add').classList.toggle('shadow-sm', tab === 'add');
            document.getElementById('tab-add').classList.toggle('text-slate-800', tab === 'add');
            document.getElementById('tab-add').classList.toggle('text-slate-500', tab !== 'add');

            document.getElementById('tab-list').classList.toggle('bg-white', tab === 'list');
            document.getElementById('tab-list').classList.toggle('shadow-sm', tab === 'list');
            document.getElementById('tab-list').classList.toggle('text-slate-800', tab === 'list');
            document.getElementById('tab-list').classList.toggle('text-slate-500', tab !== 'list');
            
            if (tab === 'list') loadEmployeeList();
        }

        function toggleAdminView() {
            if (ADMIN_IDS.includes(currentUser.id)) showAdminDashboard();
        }
    </script>
</body>
</html>
