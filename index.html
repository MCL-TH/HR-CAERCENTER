<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR C❤️RE CENTER - Maersk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; }
        .maersk-blue { color: #007EB3; }
        .bg-maersk { background-color: #007EB3; }
        .step-animation { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .size-card { transition: all 0.2s; border: 2px solid #f1f5f9; }
        .size-radio:checked + .size-card { border-color: #007EB3; background-color: #e6f2f7; color: #007EB3; }
        .loading-screen { position: fixed; inset: 0; background: white; z-index: 999; display: flex; flex-direction: column; items-center; justify-content: center; }
    </style>
</head>
<body class="antialiased">

    <!-- Loading -->
    <div id="loader" class="loading-screen">
        <div class="w-12 h-12 border-4 border-blue-100 border-t-[#007EB3] rounded-full animate-spin mb-4"></div>
        <p class="text-[#007EB3] font-bold tracking-widest animate-pulse uppercase">HR C❤️RE CENTER</p>
    </div>

    <div class="max-w-[480px] mx-auto min-h-screen bg-white shadow-2xl flex flex-col">
        
        <!-- Header -->
        <header class="p-6 border-b flex justify-between items-center sticky top-0 bg-white z-10">
            <div class="flex items-center gap-3">
                <div class="bg-maersk p-2 rounded-xl shadow-md">
                    <svg width="20" height="20" viewBox="0 0 100 100" fill="white"><path d="M50 15L58 42H85L63 58L71 85L50 68L29 85L37 58L15 42H42L50 15Z"/></svg>
                </div>
                <h1 class="font-bold text-lg maersk-blue tracking-tighter uppercase leading-none">HR C❤️RE<br><span class="text-[10px] tracking-[0.2em] text-gray-400">CENTER</span></h1>
            </div>
            <div id="user-pill" class="hidden flex items-center gap-2 bg-gray-50 px-3 py-1.5 rounded-full border">
                <img id="user-avatar" class="w-5 h-5 rounded-full" src="">
                <span id="user-name" class="text-[10px] font-bold text-gray-600 truncate max-w-[70px]"></span>
            </div>
        </header>

        <main class="flex-grow p-6">
            <!-- VIEW: LOGIN/REGISTER -->
            <section id="view-auth" class="hidden step-animation py-8 text-center">
                <div class="w-20 h-20 bg-blue-50 rounded-3xl flex items-center justify-center mx-auto mb-6">
                    <svg class="w-10 h-10 maersk-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-width="1.5"/></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">ลงทะเบียนพนักงาน</h2>
                <p class="text-gray-400 text-sm mb-8">กรุณาระบุรหัสพนักงาน 7 หลักเพื่อเชื่อมต่อ</p>
                
                <input type="text" id="emp-id-input" maxlength="7" inputmode="numeric" placeholder="0000000"
                    class="w-full p-5 bg-gray-50 border-2 border-gray-100 rounded-2xl text-center text-3xl font-bold tracking-[0.3em] outline-none focus:border-[#007EB3] transition-all mb-4">
                
                <button onclick="handleVerify()" class="w-full bg-maersk text-white font-bold py-5 rounded-2xl shadow-lg shadow-blue-100 active:scale-95 transition-all">
                    ตรวจสอบข้อมูล
                </button>
            </section>

            <!-- VIEW: SELECTION FORM -->
            <section id="view-form" class="hidden step-animation space-y-8">
                <div class="bg-blue-50 p-5 rounded-3xl border border-blue-100">
                    <p class="text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-1">ยินดีต้อนรับ</p>
                    <h3 id="display-emp-name" class="text-xl font-bold text-gray-800"></h3>
                    <p id="display-emp-detail" class="text-sm text-gray-500"></p>
                </div>

                <!-- Shirt Selection -->
                <div class="space-y-4">
                    <label class="block font-bold text-gray-700 flex items-center gap-2">
                        <span class="w-6 h-6 bg-gray-100 rounded flex items-center justify-center text-xs">1</span>
                        เลือกไซส์เสื้อยูนิฟอร์ม (รอบอก)
                    </label>
                    <div class="grid grid-cols-3 gap-2" id="shirt-grid"></div>
                </div>

                <!-- Shoe Selection -->
                <div class="space-y-4">
                    <label class="block font-bold text-gray-700 flex items-center gap-2">
                        <span class="w-6 h-6 bg-gray-100 rounded flex items-center justify-center text-xs">2</span>
                        เลือกไซส์รองเท้าเซฟตี้ (EU)
                    </label>
                    <div class="grid grid-cols-4 gap-2" id="shoe-grid"></div>
                </div>

                <button onclick="submitRegistration()" class="w-full bg-maersk text-white font-bold py-5 rounded-2xl shadow-xl hover:brightness-110 transition-all mt-6">
                    ยืนยันข้อมูลและลงทะเบียน
                </button>
            </section>

            <!-- VIEW: SUCCESS/DASHBOARD -->
            <section id="view-success" class="hidden step-animation text-center py-12">
                <div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6 text-green-500">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3"/></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">ลงทะเบียนเรียบร้อย</h2>
                <p class="text-gray-500 text-sm mb-8">ขอบคุณสำหรับการแจ้งข้อมูลสวัสดิการ</p>
                <div class="bg-gray-50 p-6 rounded-3xl border border-dashed border-gray-200 text-left space-y-2 mb-8">
                    <div class="flex justify-between"><span class="text-gray-400 text-xs">ไซส์เสื้อ:</span> <span id="res-shirt" class="font-bold maersk-blue"></span></div>
                    <div class="flex justify-between"><span class="text-gray-400 text-xs">ไซส์รองเท้า:</span> <span id="res-shoe" class="font-bold maersk-blue"></span></div>
                </div>
                <button onclick="liff.closeWindow()" class="w-full border-2 border-gray-100 text-gray-400 font-bold py-4 rounded-2xl">ปิดหน้าต่าง</button>
            </section>
        </main>

        <footer class="p-8 text-center">
            <p class="text-[9px] font-bold text-gray-300 tracking-[0.4em] uppercase">Maersk Global Service Centre</p>
        </footer>
    </div>

    <!-- Firebase SDK (Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyCWhf-BRWNMk5C6QzCUJbVVwGgUK9mnMoU",
            authDomain: "hr-carecenter.firebaseapp.com",
            projectId: "hr-carecenter",
            storageBucket: "hr-carecenter.firebasestorage.app",
            messagingSenderId: "935576170295",
            appId: "1:935576170295:web:a30e4a6d50eb0b4ff4f4b2"
        };
        const LIFF_ID = "2009930285-1b2B5ytM";
        const APP_ID = "maersk-registration"; 
        const COLLECTION = `artifacts/${APP_ID}/public/data/employees`;

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let lineProfile = null;
        let currentUser = null;

        const SHIRT_SIZES = [
            {l: 'SS', c: 34}, {l: 'S', c: 36}, {l: 'M', c: 38}, {l: 'L', c: 40}, 
            {l: 'XL', c: 42}, {l: '2XL', c: 44}, {l: '3XL', c: 46}, {l: '4XL', c: 48}, {l: '5XL', c: 50}
        ];

        window.onload = async () => {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                
                lineProfile = await liff.getProfile();
                document.getElementById('user-pill').classList.remove('hidden');
                document.getElementById('user-avatar').src = lineProfile.pictureUrl;
                document.getElementById('user-name').innerText = lineProfile.displayName;

                await auth.signInAnonymously();
                
                // ตรวจสอบว่า Line ID นี้ผูกกับใครไว้หรือยัง
                const snapshot = await db.collection(COLLECTION)
                    .where("lineUid", "==", lineProfile.userId).limit(1).get();

                if (!snapshot.empty) {
                    currentUser = { id: snapshot.docs[0].id, ...snapshot.docs[0].data() };
                    showView('view-success');
                    renderSuccess();
                } else {
                    showView('view-auth');
                }
                
                renderGrids();
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบได้', 'error');
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        };

        function renderGrids() {
            const shirtGrid = document.getElementById('shirt-grid');
            const shoeGrid = document.getElementById('shoe-grid');

            SHIRT_SIZES.forEach(s => {
                shirtGrid.innerHTML += `
                    <label class="cursor-pointer">
                        <input type="radio" name="shirt" value="${s.l}" class="hidden size-radio">
                        <div class="size-card p-3 rounded-2xl text-center bg-gray-50">
                            <div class="font-bold text-sm">${s.l}</div>
                            <div class="text-[9px] opacity-50">${s.c}"</div>
                        </div>
                    </label>`;
            });

            for (let i = 36; i <= 48; i++) {
                shoeGrid.innerHTML += `
                    <label class="cursor-pointer">
                        <input type="radio" name="shoe" value="${i}" class="hidden size-radio">
                        <div class="size-card p-3 rounded-xl text-center bg-gray-50">
                            <div class="font-bold text-sm">${i}</div>
                        </div>
                    </label>`;
            }
        }

        async function handleVerify() {
            const id = document.getElementById('emp-id-input').value.trim();
            if (id.length !== 7) {
                return Swal.fire('ข้อมูลไม่ครบ', 'รหัสพนักงานต้องมี 7 หลัก', 'warning');
            }

            Swal.fire({ title: 'กำลังค้นหา...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                // 1. ตรวจสอบรหัสพนักงานในฐานข้อมูล
                const docRef = db.collection(COLLECTION).doc(id);
                const doc = await docRef.get();

                if (!doc.exists) {
                    return Swal.fire('ไม่พบข้อมูล', 'ไม่พบรหัสพนักงานนี้ในระบบ HR', 'error');
                }

                const data = doc.data();

                // 2. ตรวจสอบว่ารหัสนี้ถูกคนอื่นผูกไปหรือยัง (ป้องกัน 1 รหัส : หลาย Line)
                if (data.lineUid && data.lineUid !== lineProfile.userId) {
                    return Swal.fire('ลงทะเบียนแล้ว', 'รหัสพนักงานนี้ถูกผูกกับบัญชี LINE อื่นแล้ว', 'error');
                }

                currentUser = { id, ...data };
                
                // แสดงข้อมูลให้กดยืนยันตัวตน
                Swal.fire({
                    title: 'ยืนยันข้อมูลพนักงาน',
                    html: `<div class="text-left text-sm space-y-1 p-2 bg-gray-50 rounded-xl">
                            <p><b>ชื่อ:</b> ${data.name}</p>
                            <p><b>ตำแหน่ง:</b> ${data.position}</p>
                            <p><b>แผนก:</b> ${data.dept}</p>
                           </div>`,
                    showCancelButton: true,
                    confirmButtonText: 'ใช่ นี่คือฉันเอง',
                    confirmButtonColor: '#007EB3'
                }).then(res => {
                    if (res.isConfirmed) {
                        document.getElementById('display-emp-name').innerText = data.name;
                        document.getElementById('display-emp-detail').innerText = `${data.position} | ${data.dept}`;
                        showView('view-form');
                    }
                });

            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            } finally {
                Swal.close();
            }
        }

        async function submitRegistration() {
            const shirt = document.querySelector('input[name="shirt"]:checked')?.value;
            const shoe = document.querySelector('input[name="shoe"]:checked')?.value;

            if (!shirt || !shoe) {
                return Swal.fire('ระบุข้อมูล', 'กรุณาเลือกไซส์ให้ครบถ้วน', 'warning');
            }

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                // ผูก UID และบันทึกไซส์
                await db.collection(COLLECTION).doc(currentUser.id).update({
                    lineUid: lineProfile.userId,
                    lineDisplayName: lineProfile.displayName,
                    shirtSize: shirt,
                    shoeSize: shoe,
                    registeredAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                currentUser.shirtSize = shirt;
                currentUser.shoeSize = shoe;
                
                renderSuccess();
                showView('view-success');
                Swal.fire({ icon: 'success', title: 'สำเร็จ', timer: 1500, showConfirmButton: false });

            } catch (err) {
                Swal.fire('Error', 'บันทึกไม่สำเร็จ: ' + err.message, 'error');
            }
        }

        function renderSuccess() {
            document.getElementById('res-shirt').innerText = currentUser.shirtSize;
            document.getElementById('res-shoe').innerText = currentUser.shoeSize + " EU";
        }

        function showView(id) {
            ['view-auth', 'view-form', 'view-success'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
