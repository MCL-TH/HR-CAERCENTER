<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงทะเบียนพนักงาน</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col p-4">
        <!-- Loading State -->
        <div id="loading-overlay" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-600"></div>
            <p class="mt-4 text-slate-500 text-sm">กำลังโหลดระบบ...</p>
        </div>

        <!-- Main Content -->
        <main class="flex-grow pt-8">
            <!-- Header Section -->
            <div class="text-center mb-8">
                <div class="inline-block p-3 bg-blue-600 rounded-2xl shadow-lg mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">ระบบลงทะเบียนพนักงาน</h1>
                <p class="text-slate-500">ลงทะเบียนรับเสื้อยูนิฟอร์มประจำปี</p>
            </div>

            <!-- Registration Card -->
            <div class="glass-morphism rounded-3xl shadow-xl overflow-hidden mb-6">
                <!-- Step 1: Employee ID Check -->
                <div id="step-1" class="p-6">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-700 mb-2">รหัสพนักงาน</label>
                        <div class="relative">
                            <input type="text" id="emp-id-input" 
                                class="w-full px-4 py-3 bg-slate-100 border-transparent focus:border-blue-500 focus:bg-white focus:ring-0 rounded-xl transition-all outline-none" 
                                placeholder="เช่น EMP001">
                        </div>
                    </div>
                    <button onclick="handleVerifyEmployee()" id="btn-verify"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center">
                        <span id="btn-verify-text">ตรวจสอบรหัสพนักงาน</span>
                    </button>
                </div>

                <!-- Step 2: Employee Data & Selection -->
                <div id="step-2" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <!-- Info Badge -->
                    <div class="bg-blue-600 p-6 text-white">
                        <p class="text-blue-100 text-xs uppercase tracking-wider mb-1 font-medium">ข้อมูลพนักงาน</p>
                        <h2 id="display-full-name" class="text-xl font-bold">-</h2>
                        <div class="grid grid-cols-2 gap-4 mt-4 text-sm">
                            <div>
                                <p class="text-blue-200">แผนก</p>
                                <p id="display-dept" class="font-medium">-</p>
                            </div>
                            <div>
                                <p class="text-blue-200">ตำแหน่ง</p>
                                <p id="display-pos" class="font-medium">-</p>
                            </div>
                            <div class="col-span-2">
                                <p class="text-blue-200">อายุงาน</p>
                                <p id="display-tenure" class="font-medium">-</p>
                            </div>
                        </div>
                    </div>

                    <!-- Form Selection -->
                    <div class="p-6 bg-white">
                        <form id="reg-form" onsubmit="handleRegistration(event)">
                            <div class="mb-6">
                                <label class="block text-sm font-bold text-slate-700 mb-3">ไซส์เสื้อยูนิฟอร์ม</label>
                                <div class="grid grid-cols-3 gap-3">
                                    <!-- Size Options -->
                                    <label class="size-option relative">
                                        <input type="radio" name="shirt-size" value="S" class="hidden peer" required>
                                        <div class="text-center py-3 border-2 border-slate-100 rounded-xl peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-600 transition-all cursor-pointer font-medium">S</div>
                                    </label>
                                    <label class="size-option relative">
                                        <input type="radio" name="shirt-size" value="M" class="hidden peer">
                                        <div class="text-center py-3 border-2 border-slate-100 rounded-xl peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-600 transition-all cursor-pointer font-medium">M</div>
                                    </label>
                                    <label class="size-option relative">
                                        <input type="radio" name="shirt-size" value="L" class="hidden peer">
                                        <div class="text-center py-3 border-2 border-slate-100 rounded-xl peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-600 transition-all cursor-pointer font-medium">L</div>
                                    </label>
                                    <label class="size-option relative">
                                        <input type="radio" name="shirt-size" value="XL" class="hidden peer">
                                        <div class="text-center py-3 border-2 border-slate-100 rounded-xl peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-600 transition-all cursor-pointer font-medium">XL</div>
                                    </label>
                                    <label class="size-option relative">
                                        <input type="radio" name="shirt-size" value="2XL" class="hidden peer">
                                        <div class="text-center py-3 border-2 border-slate-100 rounded-xl peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-600 transition-all cursor-pointer font-medium">2XL</div>
                                    </label>
                                    <label class="size-option relative">
                                        <input type="radio" name="shirt-size" value="3XL" class="hidden peer">
                                        <div class="text-center py-3 border-2 border-slate-100 rounded-xl peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-600 transition-all cursor-pointer font-medium">3XL</div>
                                    </label>
                                </div>
                            </div>
                            <button type="submit" id="btn-submit"
                                class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95">
                                บันทึกการลงทะเบียน
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            
            <p class="text-center text-slate-400 text-[10px]">โปรดตรวจสอบข้อมูลให้ถูกต้องก่อนกดยืนยัน</p>
        </main>

        <footer class="py-6 text-center text-slate-400 text-xs">
            &copy; 2024 ระบบจัดการพนักงานภายในองค์กร
        </footer>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- Firebase Configuration ---
        // ใส่ข้อมูลจาก Firebase Console ของคุณตรงนี้
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State
        let lineUserId = "";
        let currentEmployee = null;

        // Initialize LIFF
        async function initLiff() {
            try {
                await liff.init({ liffId: "YOUR_LIFF_ID" }); // ใส่ LIFF ID ของคุณ
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    lineUserId = profile.userId;
                    document.getElementById('loading-overlay').classList.add('hidden');
                }
            } catch (error) {
                console.error("LIFF Init Error:", error);
                alert("ไม่สามารถเชื่อมต่อกับ LINE ได้");
            }
        }

        // Verify Employee Logic
        window.handleVerifyEmployee = async () => {
            const empId = document.getElementById('emp-id-input').value.trim();
            if (!empId) {
                alert("กรุณากรอกรหัสพนักงาน");
                return;
            }

            const btn = document.getElementById('btn-verify');
            const btnText = document.getElementById('btn-verify-text');
            
            btn.disabled = true;
            btnText.innerText = "กำลังตรวจสอบ...";

            try {
                // ค้นหาใน collection employee_master โดยใช้ ID เป็นรหัสพนักงาน
                const docRef = doc(db, "employee_master", empId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    currentEmployee = { id: empId, ...docSnap.data() };
                    renderEmployeeInfo(currentEmployee);
                    document.getElementById('step-1').classList.add('hidden');
                    document.getElementById('step-2').classList.remove('hidden');
                } else {
                    alert("ไม่พบรหัสพนักงานนี้ในฐานข้อมูล");
                    btn.disabled = false;
                    btnText.innerText = "ตรวจสอบรหัสพนักงาน";
                }
            } catch (error) {
                console.error("Firebase Error:", error);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล");
                btn.disabled = false;
                btnText.innerText = "ตรวจสอบรหัสพนักงาน";
            }
        };

        // UI Rendering
        function renderEmployeeInfo(data) {
            document.getElementById('display-full-name').innerText = `${data.name} ${data.surname}`;
            document.getElementById('display-dept').innerText = data.department || "ไม่ระบุ";
            document.getElementById('display-pos').innerText = data.position || "ไม่ระบุ";
            
            // อายุงาน Calculation
            if (data.startDate) {
                const start = new Date(data.startDate);
                const now = new Date();
                const years = now.getFullYear() - start.getFullYear();
                const months = now.getMonth() - start.getMonth();
                const totalMonths = (years * 12) + months;
                
                const displayYears = Math.floor(totalMonths / 12);
                const displayMonths = totalMonths % 12;
                document.getElementById('display-tenure').innerText = `${displayYears} ปี ${displayMonths} เดือน`;
            }
        }

        // Handle Registration
        window.handleRegistration = async (e) => {
            e.preventDefault();
            const selectedSize = document.querySelector('input[name="shirt-size"]:checked')?.value;
            
            if (!selectedSize) {
                alert("กรุณาเลือกไซส์เสื้อ");
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = "กำลังบันทึก...";

            try {
                // บันทึกข้อมูลลง collection registrations
                // ใช้ lineUserId เป็น Doc ID เพื่อให้ 1 คนลงทะเบียนได้ครั้งเดียว
                await setDoc(doc(db, "registrations", lineUserId), {
                    lineUserId: lineUserId,
                    empId: currentEmployee.id,
                    fullName: `${currentEmployee.name} ${currentEmployee.surname}`,
                    tshirtSize: selectedSize,
                    timestamp: serverTimestamp()
                });

                alert("ลงทะเบียนสำเร็จ ขอบคุณครับ");
                liff.closeWindow();
            } catch (error) {
                console.error("Save Error:", error);
                alert("ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่อีกครั้ง");
                btn.disabled = false;
                btn.innerText = "บันทึกการลงทะเบียน";
            }
        };

        // Start
        initLiff();
    </script>
</body>
</html>
