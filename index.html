<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR C❤️RE CENTER - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .maersk-blue { color: #007EB3; }
        .bg-maersk { background-color: #007EB3; }
        .step-animation { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Loading Styles */
        #loader { 
            position: fixed; inset: 0; background: white; z-index: 1000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }

        .size-card { transition: all 0.2s; border: 2px solid #f1f5f9; cursor: pointer; }
        .size-radio:checked + .size-card { border-color: #007EB3; background-color: #eff6ff; color: #007EB3; transform: scale(1.02); }
    </style>
</head>
<body class="antialiased">

    <!-- Loading Screen -->
    <div id="loader">
        <div class="relative flex items-center justify-center">
            <div class="w-16 h-16 border-4 border-blue-50 border-t-[#007EB3] rounded-full animate-spin"></div>
            <div class="absolute text-[10px] font-bold maersk-blue">HR</div>
        </div>
        <p class="mt-4 text-[#007EB3] font-medium tracking-widest animate-pulse uppercase text-xs">กำลังโหลดข้อมูล...</p>
    </div>

    <div class="max-w-[480px] mx-auto min-h-screen bg-white shadow-2xl flex flex-col">
        <!-- Header -->
        <header class="p-6 border-b flex justify-between items-center sticky top-0 bg-white/80 backdrop-blur-md z-10">
            <div class="flex items-center gap-3">
                <div class="bg-maersk p-2 rounded-xl shadow-md">
                    <svg width="20" height="20" viewBox="0 0 100 100" fill="white"><path d="M50 15L58 42H85L63 58L71 85L50 68L29 85L37 58L15 42H42L50 15Z"/></svg>
                </div>
                <h1 class="font-bold text-lg maersk-blue tracking-tighter uppercase leading-none">HR C❤️RE<br><span class="text-[10px] tracking-[0.2em] text-gray-400">CENTER</span></h1>
            </div>
            <div id="user-pill" class="hidden flex items-center gap-2 bg-gray-50 px-3 py-1.5 rounded-full border">
                <img id="user-avatar" class="w-5 h-5 rounded-full" src="">
                <span id="user-name" class="text-[10px] font-bold text-gray-600 truncate max-w-[70px]"></span>
            </div>
        </header>

        <main class="flex-grow p-6">
            
            <!-- Step 1: Input ID -->
            <section id="step-1" class="hidden step-animation py-8 text-center">
                <div class="w-20 h-20 bg-blue-50 rounded-3xl flex items-center justify-center mx-auto mb-6">
                    <svg class="w-10 h-10 maersk-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-width="1.5"/></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">เข้าสู่ระบบ</h2>
                <p class="text-gray-400 text-sm mb-8">กรุณากรอกรหัสพนักงานของคุณ</p>
                <input type="text" id="emp-id-input" maxlength="15" placeholder="รหัสพนักงาน"
                    class="w-full p-5 bg-gray-50 border-2 border-gray-100 rounded-2xl text-center text-2xl font-bold outline-none focus:border-[#007EB3] transition-all mb-4">
                <button onclick="checkEmployeeID()" class="w-full bg-maersk text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-all">ถัดไป</button>
            </section>

            <!-- Step 2: Verification (Show Name/Position) -->
            <section id="step-2" class="hidden step-animation py-8">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-amber-50 rounded-3xl flex items-center justify-center mx-auto mb-6 text-amber-500">
                        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2"/></svg>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">ตรวจสอบข้อมูล</h2>
                    <p class="text-gray-400 text-sm">ข้อมูลนี้เป็นของคุณใช่หรือไม่?</p>
                </div>

                <div class="bg-slate-50 p-6 rounded-3xl border-2 border-slate-100 mb-8 space-y-4">
                    <div>
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">ชื่อ-นามสกุล</p>
                        <p id="verify-name" class="text-xl font-bold text-slate-800">-</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-200">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">ตำแหน่ง</p>
                            <p id="verify-pos" class="text-sm font-medium text-slate-600">-</p>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">ฝ่าย/แผนก</p>
                            <p id="verify-dept" class="text-sm font-medium text-slate-600">-</p>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button onclick="showStep(1)" class="flex-1 bg-gray-100 text-gray-500 font-bold py-5 rounded-2xl">ไม่ใช่ฉัน</button>
                    <button onclick="confirmEmployee()" class="flex-[2] bg-maersk text-white font-bold py-5 rounded-2xl shadow-lg shadow-blue-200">ใช่ นี่คือฉัน</button>
                </div>
            </section>

            <!-- Step 3: Size Selection -->
            <section id="step-3" class="hidden step-animation space-y-8">
                <div class="flex items-center gap-4 bg-blue-50 p-4 rounded-2xl border border-blue-100">
                    <div class="bg-white p-2 rounded-xl shadow-sm font-bold text-xs maersk-blue" id="locked-id">ID: -</div>
                    <div class="text-xs font-bold text-blue-800 truncate" id="locked-name"></div>
                </div>

                <div class="space-y-4">
                    <label class="block font-bold text-gray-700 flex items-center gap-2">👕 ไซส์เสื้อยูนิฟอร์ม (รอบอก)</label>
                    <div class="grid grid-cols-3 gap-2" id="shirt-grid"></div>
                </div>

                <div class="space-y-4">
                    <label class="block font-bold text-gray-700 flex items-center gap-2">👟 ไซส์รองเท้าเซฟตี้ (EU)</label>
                    <div class="grid grid-cols-4 gap-2" id="shoe-grid"></div>
                </div>

                <button onclick="submitRegistration()" class="w-full bg-maersk text-white font-bold py-5 rounded-2xl shadow-xl hover:brightness-110 active:scale-95 transition-all mt-6">บันทึกข้อมูล</button>
            </section>

            <!-- Step 4: Success -->
            <section id="step-4" class="hidden step-animation text-center py-12">
                <div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6 text-green-500">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3"/></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">บันทึกเรียบร้อย</h2>
                <p class="text-gray-400 text-sm mb-8">ขอบคุณสำหรับการให้ข้อมูล</p>
                <button onclick="liff.closeWindow()" class="w-full bg-gray-100 text-gray-500 font-bold py-4 rounded-2xl">ปิดหน้าต่าง</button>
            </section>

        </main>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCWhf-BRWNMk5C6QzCUJbVVwGgUK9mnMoU",
            authDomain: "hr-carecenter.firebaseapp.com",
            projectId: "hr-carecenter",
            storageBucket: "hr-carecenter.firebasestorage.app",
            messagingSenderId: "935576170295",
            appId: "1:935576170295:web:a30e4a6d50eb0b4ff4f4b2"
        };
        const LIFF_ID = "2009930285-1b2B5ytM";
        const APP_ID = "maersk-registration"; 
        const COLLECTION = `artifacts/${APP_ID}/public/data/employees`;

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let lineProfile = null;
        let selectedEmployee = null;

        const SHIRT_SIZES = [{l: 'SS', c: 34}, {l: 'S', c: 36}, {l: 'M', c: 38}, {l: 'L', c: 40}, {l: 'XL', c: 42}, {l: '2XL', c: 44}, {l: '3XL', c: 46}, {l: '4XL', c: 48}, {l: '5XL', c: 50}];

        window.onload = async () => {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) { liff.login(); return; }
                lineProfile = await liff.getProfile();
                
                document.getElementById('user-pill').classList.remove('hidden');
                document.getElementById('user-avatar').src = lineProfile.pictureUrl;
                document.getElementById('user-name').innerText = lineProfile.displayName;

                await auth.signInAnonymously();
                
                // ตรวจสอบว่าเคยลงทะเบียนไปแล้วหรือยัง
                const snapshot = await db.collection(COLLECTION).where("lineUid", "==", lineProfile.userId).limit(1).get();
                if (!snapshot.empty) {
                    showStep(4);
                } else {
                    showStep(1);
                }
                renderGrids();
            } catch (err) {
                Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบได้', 'error');
            } finally {
                setTimeout(() => { document.getElementById('loader').classList.add('hidden'); }, 800);
            }
        };

        function renderGrids() {
            const shirtGrid = document.getElementById('shirt-grid');
            const shoeGrid = document.getElementById('shoe-grid');
            SHIRT_SIZES.forEach(s => {
                shirtGrid.innerHTML += `<label><input type="radio" name="shirt" value="${s.l}" class="hidden size-radio"><div class="size-card p-3 rounded-2xl text-center bg-gray-50"><div class="font-bold text-sm">${s.l}</div><div class="text-[9px] opacity-50">${s.c}"</div></div></label>`;
            });
            for (let i = 36; i <= 48; i++) {
                shoeGrid.innerHTML += `<label><input type="radio" name="shoe" value="${i}" class="hidden size-radio"><div class="size-card p-3 rounded-xl text-center bg-gray-50"><div class="font-bold text-sm">${i}</div></div></label>`;
            }
        }

        async function checkEmployeeID() {
            let id = document.getElementById('emp-id-input').value.trim();
            if (!id) return Swal.fire('กรุณาใส่รหัสพนักงาน', '', 'warning');

            Swal.fire({ title: 'กำลังตรวจสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                // ค้นหาทั้งแบบรหัสดิบๆ และแบบเติม 0 ข้างหน้าให้ครบ 7 หลัก
                const variants = [id, id.padStart(7, '0')];
                let doc = null;
                
                for (let v of variants) {
                    const snap = await db.collection(COLLECTION).doc(v).get();
                    if (snap.exists) { doc = snap; break; }
                }

                if (!doc) {
                    return Swal.fire({ icon: 'error', title: 'ไม่พบรหัสพนักงาน', text: 'กรุณาตรวจสอบรหัสอีกครั้ง หรือติดต่อ HR' });
                }

                const data = doc.data();
                if (data.lineUid && data.lineUid !== lineProfile.userId) {
                    return Swal.fire('ลงทะเบียนแล้ว', 'รหัสพนักงานนี้ถูกผูกกับบัญชีอื่นแล้ว', 'error');
                }

                selectedEmployee = { id: doc.id, ...data };
                
                // แสดงข้อมูลพนักงานใน Step 2
                document.getElementById('verify-name').innerText = data.name || '-';
                document.getElementById('verify-pos').innerText = data.position || '-';
                document.getElementById('verify-dept').innerText = data.dept || '-';
                
                Swal.close();
                showStep(2);
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            }
        }

        function confirmEmployee() {
            // ล็อคข้อมูลและไป Step 3
            document.getElementById('locked-id').innerText = `ID: ${selectedEmployee.id}`;
            document.getElementById('locked-name').innerText = selectedEmployee.name;
            showStep(3);
        }

        async function submitRegistration() {
            const shirt = document.querySelector('input[name="shirt"]:checked')?.value;
            const shoe = document.querySelector('input[name="shoe"]:checked')?.value;
            if (!shirt || !shoe) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาเลือกไซส์เสื้อและรองเท้า', 'warning');

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                await db.collection(COLLECTION).doc(selectedEmployee.id).update({
                    lineUid: lineProfile.userId,
                    lineDisplayName: lineProfile.displayName,
                    shirtSize: shirt,
                    shoeSize: shoe,
                    registeredAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showStep(4);
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false });
            } catch (err) {
                Swal.fire('Error', 'ไม่สามารถบันทึกได้: ' + err.message, 'error');
            }
        }

        function showStep(num) {
            ['step-1', 'step-2', 'step-3', 'step-4'].forEach((id, idx) => {
                document.getElementById(id).classList.toggle('hidden', idx + 1 !== num);
            });
        }
    </script>
</body>
</html>
