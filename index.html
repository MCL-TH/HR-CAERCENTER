<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR C❤️RE CENTER - Uniform Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        body { font-family: 'Kanit', sans-serif; background-color: #f3f4f6; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .btn-primary { background-color: #ef4444; transition: all 0.3s; }
        .btn-primary:hover { background-color: #dc2626; transform: translateY(-2px); }
        .card-anim { transition: all 0.3s ease; }
        .size-chip { cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
        .size-chip.active { border-color: #ef4444; background-color: #fee2e2; color: #ef4444; }
        #loadingOverlay { background: rgba(255,255,255,0.8); z-index: 100; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 flex items-center justify-center">
        <div class="text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-red-500 mb-4"></div>
            <p class="text-gray-600">กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <!-- Header & Profile -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl"></span>
                <h1 class="text-xl font-bold text-gray-800">HR C❤️RE CENTER</h1>
            </div>
            <div id="userProfile" class="hidden flex items-center gap-2">
                <img id="linePic" class="w-8 h-8 rounded-full border border-gray-200" src="" alt="Profile">
                <span id="lineName" class="text-sm font-medium text-gray-600 truncate max-w-[100px]"></span>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-md mx-auto w-full">
        
        <!-- Section 1: Employee Verification -->
        <div id="verifyStep" class="glass rounded-3xl p-8 shadow-xl mb-6">
            <h2 class="text-2xl font-semibold mb-2 text-center text-red-600">ลงทะเบียนพนักงาน</h2>
            <p class="text-gray-500 text-center mb-8 text-sm">กรุณาระบุรหัสพนักงาน 7 หลักเพื่อเริ่มต้น</p>
            
            <div class="space-y-4">
                <div class="relative">
                    <i class="fa-solid fa-id-badge absolute left-4 top-4 text-gray-400"></i>
                    <input type="number" id="empIdInput" 
                        class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-red-400 focus:border-transparent outline-none text-lg tracking-widest"
                        placeholder="รหัสพนักงาน 7 หลัก" pattern="\d{7}" maxlength="7">
                </div>
                <button onclick="verifyEmployee()" class="w-full btn-primary text-white py-4 rounded-xl font-semibold text-lg shadow-lg">
                    ตรวจสอบข้อมูล
                </button>
            </div>
        </div>

        <!-- Section 2: Info & Confirmation -->
        <div id="infoStep" class="hidden glass rounded-3xl p-8 shadow-xl mb-6 card-anim">
            <h3 class="text-xl font-semibold mb-6 flex items-center gap-2">
                <i class="fa-solid fa-circle-check text-green-500"></i> ยืนยันตัวตน
            </h3>
            <div class="space-y-4 bg-gray-50 p-6 rounded-2xl border border-gray-100">
                <div>
                    <label class="text-xs text-gray-400 uppercase">ชื่อ-นามสกุล</label>
                    <p id="dispName" class="font-medium text-gray-800">-</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-400 uppercase">ตำแหน่ง</label>
                        <p id="dispPos" class="font-medium text-gray-800">-</p>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase">แผนก</label>
                        <p id="dispDept" class="font-medium text-gray-800">-</p>
                    </div>
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="resetApp()" class="flex-1 py-3 border border-gray-200 rounded-xl text-gray-500 font-medium">ยกเลิก</button>
                <button onclick="confirmIdentity()" class="flex-[2] py-3 btn-primary text-white rounded-xl font-semibold shadow-md">ถูกต้อง ยืนยัน</button>
            </div>
        </div>

        <!-- Section 3: Size Selection -->
        <div id="selectionStep" class="hidden space-y-6 mb-10">
            <!-- Shirt Size -->
            <div class="glass rounded-3xl p-6 shadow-lg">
                <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-shirt text-blue-500"></i> เลือกไซส์เสื้อยูนิฟอร์ม
                </h3>
                <div class="grid grid-cols-3 gap-3" id="shirtGrid">
                    <!-- JS will render chips here -->
                </div>
            </div>

            <!-- Shoe Size -->
            <div class="glass rounded-3xl p-6 shadow-lg">
                <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-boot-heeled text-orange-500"></i> เลือกรองเท้าเซฟตี้
                </h3>
                <div class="grid grid-cols-4 gap-2" id="shoeGrid">
                    <!-- JS will render chips here -->
                </div>
            </div>

            <button onclick="submitRegistration()" id="submitBtn" class="w-full btn-primary text-white py-5 rounded-3xl font-bold text-xl shadow-xl disabled:opacity-50">
                บันทึกข้อมูลและลงทะเบียน
            </button>
        </div>

        <!-- Section 4: Success/Dashboard -->
        <div id="resultStep" class="hidden glass rounded-3xl p-8 shadow-xl text-center">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">ลงทะเบียนสำเร็จ!</h2>
            <p class="text-gray-500 mb-6">ข้อมูลของคุณถูกผูกกับ LINE เรียบร้อยแล้ว</p>
            <div class="text-left bg-gray-50 p-4 rounded-xl text-sm space-y-2 mb-6">
                <p><strong>ไซส์เสื้อ:</strong> <span id="resShirt">-</span></p>
                <p><strong>ไซส์รองเท้า:</strong> <span id="resShoe">-</span></p>
            </div>
            <button onclick="liff.closeWindow()" class="w-full bg-gray-800 text-white py-3 rounded-xl">ปิดหน้าต่าง</button>
        </div>

    </main>

    <!-- Custom Toast -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full text-sm opacity-0 pointer-events-none transition-all duration-300 z-50">
        Message here
    </div>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hr-core-center';

        // State
        let lineUser = null;
        let selectedEmp = null;
        let selectedShirt = null;
        let selectedShoe = null;

        const shirtSizes = [
            { label: 'SS', desc: 'อก 34"' }, { label: 'S', desc: 'อก 36"' }, { label: 'M', desc: 'อก 38"' },
            { label: 'L', desc: 'อก 40"' }, { label: 'XL', desc: 'อก 42"' }, { label: '2XL', desc: 'อก 44"' },
            { label: '3XL', desc: 'อก 46"' }, { label: '4XL', desc: 'อก 48"' }, { label: '5XL', desc: 'อก 50"' }
        ];

        const shoeSizes = Array.from({ length: 13 }, (_, i) => 36 + i);

        // UI Helpers
        const showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('opacity-100');
            setTimeout(() => t.classList.remove('opacity-100'), 3000);
        };

        const toggleLoading = (show) => {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        };

        // Init LIFF
        async function initLiff() {
            try {
                await liff.init({ liffId: "2009930285-1b2B5ytM" }); // ใส่ LIFF ID ของคุณที่นี่
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                const profile = await liff.getProfile();
                lineUser = profile;
                
                document.getElementById('linePic').src = profile.pictureUrl;
                document.getElementById('lineName').innerText = profile.displayName;
                document.getElementById('userProfile').classList.remove('hidden');

                // Check if already registered
                checkExistingRegistration(profile.userId);
            } catch (err) {
                console.error("LIFF Init Error", err);
                toggleLoading(false);
            }
        }

        // 1. Check if this Line ID already bound to ANY employee
        async function checkExistingRegistration(uid) {
            const q = query(
                collection(db, 'artifacts', appId, 'public', 'data', 'employees'),
                where("lineUid", "==", uid)
            );
            const querySnapshot = await getDocs(q);
            if (!querySnapshot.empty) {
                const empData = querySnapshot.docs[0].data();
                showDashboard(empData);
            } else {
                toggleLoading(false);
            }
        }

        function showDashboard(data) {
            document.getElementById('verifyStep').classList.add('hidden');
            document.getElementById('resultStep').classList.remove('hidden');
            document.getElementById('resShirt').innerText = data.shirtSize || 'ยังไม่ระบุ';
            document.getElementById('resShoe').innerText = data.shoeSize || 'ยังไม่ระบุ';
            toggleLoading(false);
        }

        // 2. Verify Employee ID
        window.verifyEmployee = async () => {
            const input = document.getElementById('empIdInput').value;
            if (input.length !== 7) {
                showToast("กรุณากรอกรหัสพนักงาน 7 หลัก");
                return;
            }

            toggleLoading(true);
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'employees', input);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // Check if this employee ID already used by someone else
                    if (data.lineUid && data.lineUid !== "") {
                        showToast("รหัสพนักงานนี้ถูกลงทะเบียนด้วย Line อื่นไปแล้ว");
                        toggleLoading(false);
                        return;
                    }

                    selectedEmp = { id: input, ...data };
                    document.getElementById('dispName').innerText = data.name;
                    document.getElementById('dispPos').innerText = data.position;
                    document.getElementById('dispDept').innerText = data.dept;

                    document.getElementById('verifyStep').classList.add('hidden');
                    document.getElementById('infoStep').classList.remove('hidden');
                } else {
                    showToast("ไม่พบข้อมูลพนักงานในระบบ");
                }
            } catch (e) {
                showToast("เกิดข้อผิดพลาดในการตรวจสอบข้อมูล");
            }
            toggleLoading(false);
        };

        // 3. Confirm & Go to Size Selection
        window.confirmIdentity = () => {
            document.getElementById('infoStep').classList.add('hidden');
            document.getElementById('selectionStep').classList.remove('hidden');
            renderSizeSelection();
        };

        function renderSizeSelection() {
            // Render Shirts
            const sGrid = document.getElementById('shirtGrid');
            sGrid.innerHTML = shirtSizes.map(s => `
                <div onclick="selectShirt('${s.label}')" id="shirt-${s.label}" 
                    class="size-chip bg-white border border-gray-100 rounded-2xl p-3 text-center shadow-sm">
                    <div class="font-bold">${s.label}</div>
                    <div class="text-[10px] text-gray-400">${s.desc}</div>
                </div>
            `).join('');

            // Render Shoes
            const fGrid = document.getElementById('shoeGrid');
            fGrid.innerHTML = shoeSizes.map(s => `
                <div onclick="selectShoe('${s}')" id="shoe-${s}" 
                    class="size-chip bg-white border border-gray-100 rounded-xl p-2 text-center shadow-sm font-medium">
                    ${s}
                </div>
            `).join('');
        }

        window.selectShirt = (val) => {
            selectedShirt = val;
            document.querySelectorAll('#shirtGrid .size-chip').forEach(el => el.classList.remove('active'));
            document.getElementById(`shirt-${val}`).classList.add('active');
        };

        window.selectShoe = (val) => {
            selectedShoe = val;
            document.querySelectorAll('#shoeGrid .size-chip').forEach(el => el.classList.remove('active'));
            document.getElementById(`shoe-${val}`).classList.add('active');
        };

        // 4. Final Submission
        window.submitRegistration = async () => {
            if (!selectedShirt || !selectedShoe) {
                showToast("กรุณาเลือกทั้งไซส์เสื้อและรองเท้า");
                return;
            }

            toggleLoading(true);
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'employees', selectedEmp.id);
                
                await updateDoc(docRef, {
                    lineUid: lineUser.userId,
                    lineDisplayName: lineUser.displayName,
                    shirtSize: selectedShirt,
                    shoeSize: selectedShoe,
                    status: 'registered',
                    updatedAt: new Date().toISOString()
                });

                document.getElementById('selectionStep').classList.add('hidden');
                document.getElementById('resShirt').innerText = selectedShirt;
                document.getElementById('resShoe').innerText = selectedShoe;
                document.getElementById('resultStep').classList.remove('hidden');
                
                showToast("บันทึกข้อมูลเรียบร้อย");
            } catch (e) {
                showToast("บันทึกไม่สำเร็จ กรุณาลองใหม่");
            }
            toggleLoading(false);
        };

        window.resetApp = () => {
            selectedEmp = null;
            document.getElementById('infoStep').classList.add('hidden');
            document.getElementById('selectionStep').classList.add('hidden');
            document.getElementById('verifyStep').classList.remove('hidden');
            document.getElementById('empIdInput').value = "";
        };

        // Auth & App Start
        window.onload = async () => {
            await signInAnonymously(auth);
            onAuthStateChanged(auth, (user) => {
                if (user) initLiff();
            });
        };

    </script>
</body>
</html>
