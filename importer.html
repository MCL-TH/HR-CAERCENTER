<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - HR C❤️RE CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; }
        .admin-card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto space-y-8">
        
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">HR C❤️RE CENTER</h1>
                <p class="text-slate-400">ระบบจัดการสวัสดิการและรายชื่อพนักงาน</p>
            </div>
            <div class="flex gap-2">
                <button onclick="exportData()" class="bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl hover:bg-emerald-600 transition-all flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-width="2"/></svg>
                    Export Excel
                </button>
            </div>
        </header>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- Import Section -->
            <div class="admin-card p-8">
                <div class="flex items-center gap-3 mb-6">
                    <div class="bg-blue-100 p-2 rounded-lg text-blue-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-width="2"/></svg>
                    </div>
                    <h2 class="text-xl font-bold">Import รายชื่อพนักงาน</h2>
                </div>
                <p class="text-xs text-slate-400 mb-4">วางรูปแบบ JSON: [{"id":"1000001","name":"สมชาย","dept":"IT","position":"Staff"}]</p>
                <textarea id="json-input" rows="10" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs outline-none focus:border-blue-500 mb-4" placeholder="ระบุข้อมูลพนักงานที่นี่..."></textarea>
                <button onclick="importData()" class="w-full bg-slate-800 text-white font-bold py-4 rounded-xl hover:bg-slate-900 transition-all">
                    อัปเดตข้อมูลเข้าระบบ
                </button>
            </div>

            <!-- Stats Section -->
            <div class="admin-card p-8">
                <div class="flex items-center gap-3 mb-6">
                    <div class="bg-purple-100 p-2 rounded-lg text-purple-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-width="2"/></svg>
                    </div>
                    <h2 class="text-xl font-bold">สถานะการลงทะเบียน</h2>
                </div>
                <div class="space-y-6">
                    <div class="p-6 bg-slate-50 rounded-2xl">
                        <p class="text-slate-400 text-sm mb-1 uppercase tracking-wider">พนักงานทั้งหมด</p>
                        <p id="stat-total" class="text-4xl font-bold">0</p>
                    </div>
                    <div class="p-6 bg-emerald-50 rounded-2xl border border-emerald-100">
                        <p class="text-emerald-600 text-sm mb-1 uppercase tracking-wider">ลงทะเบียนแล้ว</p>
                        <p id="stat-reg" class="text-4xl font-bold text-emerald-700">0</p>
                    </div>
                </div>
                <div class="mt-8">
                    <p class="text-xs text-slate-400 italic leading-relaxed">
                        * ข้อมูลจะถูกอัปเดตแบบเรียลไทม์เมื่อมีการลงทะเบียนผ่าน LINE
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCWhf-BRWNMk5C6QzCUJbVVwGgUK9mnMoU",
            authDomain: "hr-carecenter.firebaseapp.com",
            projectId: "hr-carecenter",
            storageBucket: "hr-carecenter.firebasestorage.app",
            messagingSenderId: "935576170295",
            appId: "1:935576170295:web:a30e4a6d50eb0b4ff4f4b2"
        };
        const APP_ID = "maersk-registration"; 
        const COLLECTION = `artifacts/${APP_ID}/public/data/employees`;

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Load Stats
        async function fetchStats() {
            const snap = await db.collection(COLLECTION).get();
            const total = snap.size;
            const registered = snap.docs.filter(d => d.data().lineUid).length;
            
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-reg').innerText = registered;
        }

        window.onload = () => {
            firebase.auth().signInAnonymously().then(fetchStats);
        };

        async function importData() {
            const input = document.getElementById('json-input').value.trim();
            if(!input) return Swal.fire('Oops!', 'กรุณาวางข้อมูล JSON ก่อน', 'warning');

            try {
                const data = JSON.parse(input);
                Swal.fire({ title: 'กำลังนำเข้า...', didOpen: () => Swal.showLoading() });

                const batch = db.batch();
                for (const emp of data) {
                    const ref = db.collection(COLLECTION).doc(String(emp.id).padStart(7, '0'));
                    batch.set(ref, emp, { merge: true });
                }
                
                await batch.commit();
                Swal.fire('สำเร็จ', `นำเข้าข้อมูล ${data.length} รายการแล้ว`, 'success');
                document.getElementById('json-input').value = '';
                fetchStats();
            } catch (e) {
                Swal.fire('Error', 'รูปแบบ JSON ไม่ถูกต้อง', 'error');
            }
        }

        async function exportData() {
            Swal.fire({ title: 'กำลังดึงข้อมูล...', didOpen: () => Swal.showLoading() });
            try {
                const snap = await db.collection(COLLECTION).get();
                const data = snap.docs.map(d => ({
                    EmployeeID: d.id,
                    ...d.data(),
                    registeredAt: d.data().registeredAt ? d.data().registeredAt.toDate().toLocaleString('th-TH') : '-'
                }));

                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Employees");
                XLSX.writeFile(wb, `HR_CareCenter_Export_${new Date().toISOString().split('T')[0]}.xlsx`);
                Swal.close();
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            }
        }
    </script>
</body>
</html>
