<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR C❤️RE CENTER - Maersk Employee Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .tab-active { border-bottom: 3px solid #007EB3; color: #007EB3; }
        .size-btn-active { background-color: #007EB3 !important; color: white !important; border-color: #007EB3 !important; }
        .loader { border-top-color: #007EB3; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-6">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <div class="loader w-12 h-12 border-4 border-slate-100 rounded-full mb-4"></div>
        <p class="text-[#007EB3] font-bold animate-pulse">HR C❤️RE CENTER</p>
    </div>

    <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl p-6 md:p-8">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8 border-b pb-6">
            <div class="flex items-center gap-4">
                <div class="bg-[#007EB3] p-3 rounded-2xl shadow-lg">
                    <svg width="24" height="24" viewBox="0 0 100 100" fill="none"><path d="M50 15L58 42H85L63 58L71 85L50 68L29 85L37 58L15 42H42L50 15Z" fill="white"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800 leading-tight">HR C❤️RE CENTER</h1>
                    <div id="line-profile-info" class="hidden flex items-center gap-2 mt-1">
                        <img id="line-img" class="w-5 h-5 rounded-full border border-blue-100" src="">
                        <span id="line-name" class="text-gray-400 text-xs"></span>
                    </div>
                </div>
            </div>
            <button id="logout-btn" onclick="logout()" class="hidden text-red-500 text-xs font-bold border border-red-100 px-3 py-1.5 rounded-xl hover:bg-red-50 transition-all">ออกจากระบบ</button>
        </div>

        <!-- Login View -->
        <div id="view-login" class="hidden space-y-6 py-10 text-center">
            <div class="max-w-xs mx-auto">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">เชื่อมต่อพนักงาน</h2>
                    <p class="text-gray-400 text-sm">กรุณาระบุรหัสพนักงานเพื่อผูกบัญชี LINE</p>
                </div>
                <div class="text-left">
                    <label class="block text-sm font-semibold text-gray-600 mb-2">รหัสพนักงาน (7 หลัก):</label>
                    <input type="text" id="login-id" maxlength="7" inputmode="numeric" placeholder="เช่น 1008221" 
                        class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-[#007EB3] outline-none text-center text-2xl font-bold tracking-[0.2em] transition-all">
                </div>
                <button onclick="handleVerify()" class="w-full mt-4 bg-[#007EB3] text-white font-bold py-4 rounded-2xl shadow-lg hover:brightness-110 active:scale-[0.98] transition-all">
                    ตรวจสอบข้อมูล
                </button>
            </div>
        </div>

        <!-- Main Content View -->
        <div id="view-main" class="hidden animate-in fade-in">
            <!-- Admin Tabs -->
            <div id="admin-tabs" class="hidden flex gap-8 mb-6 border-b border-gray-100 overflow-x-auto">
                <button onclick="switchTab('registration')" id="tab-registration" class="pb-3 font-bold transition-all tab-active whitespace-nowrap">ลงทะเบียนไซส์</button>
                <button onclick="switchTab('import')" id="tab-import" class="pb-3 font-bold text-gray-400 hover:text-gray-600 transition-all whitespace-nowrap text-xs">จัดการฐานข้อมูล</button>
            </div>

            <!-- Registration View -->
            <div id="section-registration" class="space-y-6">
                <div class="bg-blue-50 p-6 rounded-3xl border border-blue-100">
                    <p id="user-display-name" class="text-lg font-bold text-gray-800"></p>
                    <p id="user-display-dept" class="text-sm text-gray-500 mb-4"></p>
                    <hr class="border-blue-100 mb-6">
                    
                    <div class="space-y-6">
                        <!-- Shirt Size -->
                        <div>
                            <p class="text-sm font-bold text-gray-700 mb-3">ไซส์เสื้อยูนิฟอร์ม (นิ้ว):</p>
                            <div class="grid grid-cols-3 sm:grid-cols-5 gap-2" id="shirt-options">
                                <!-- JS Generated -->
                            </div>
                        </div>

                        <!-- Shoe Size -->
                        <div>
                            <p class="text-sm font-bold text-gray-700 mb-3">ไซส์รองเท้าเซฟตี้ (EU):</p>
                            <div class="grid grid-cols-4 sm:grid-cols-7 gap-2" id="shoe-options">
                                <!-- JS Generated -->
                            </div>
                        </div>
                    </div>

                    <button onclick="saveRegistration()" class="w-full mt-8 bg-[#007EB3] text-white font-bold py-4 rounded-2xl shadow-lg hover:brightness-110 active:scale-[0.98] transition-all">บันทึกข้อมูลการลงทะเบียน</button>
                </div>
            </div>

            <!-- Management View (Admin Only) -->
            <div id="section-admin" class="hidden space-y-6">
                <div class="bg-slate-800 p-6 rounded-3xl text-white">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h3 class="font-bold">ผู้นำเข้าข้อมูล (Admin Only)</h3>
                            <p class="text-xs text-slate-400">จัดการฐานข้อมูลพนักงาน</p>
                        </div>
                        <button onclick="exportData()" class="bg-emerald-500 text-white text-xs font-bold py-2 px-4 rounded-xl hover:bg-emerald-600 transition-all">
                            <i class="fas fa-file-excel mr-1"></i> Export Excel
                        </button>
                    </div>
                    
                    <textarea id="json-input" rows="6" class="w-full p-4 bg-slate-700 border-none rounded-xl font-mono text-[10px] text-emerald-400 outline-none mb-4" placeholder='[{"id": "1008221", "name": "Test User", "dept": "HR"}]'></textarea>
                    <button onclick="startImport()" class="w-full bg-white text-slate-800 font-bold py-3 rounded-xl hover:bg-slate-100 transition-all">อัปเดตรายชื่อพนักงาน</button>
                </div>
            </div>
        </div>

        <!-- Progress Overlay -->
        <div id="progress-container" class="hidden mt-8 pt-6 border-t">
            <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                <div id="progress-bar" class="bg-[#007EB3] h-full rounded-full transition-all w-0"></div>
            </div>
            <p class="text-center text-[10px] text-gray-400 mt-2 font-bold uppercase tracking-widest">Processing</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCWhf-BRWNMk5C6QzCUJbVVwGgUK9mnMoU",
            authDomain: "hr-carecenter.firebaseapp.com",
            projectId: "hr-carecenter",
            storageBucket: "hr-carecenter.firebasestorage.app",
            messagingSenderId: "935576170295",
            appId: "1:935576170295:web:a30e4a6d50eb0b4ff4f4b2"
        };
        const LIFF_ID = "2009930285-1b2B5ytM";
        const APP_ID = "maersk-registration";
        const COLLECTION = `artifacts/${APP_ID}/public/data/employees`;

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let lineProfile = null;
        let currentUserData = null;
        let selectedSizes = { shirt: '', shoe: '' };

        const SHIRT_DATA = [
            {l: 'SS', c: 34}, {l: 'S', c: 36}, {l: 'M', c: 38}, {l: 'L', c: 40}, {l: 'XL', c: 42}, 
            {l: '2XL', c: 44}, {l: '3XL', c: 46}, {l: '4XL', c: 48}, {l: '5XL', c: 50}
        ];

        window.onload = async () => {
            renderSizeGrids();
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                lineProfile = await liff.getProfile();
                document.getElementById('line-profile-info').classList.remove('hidden');
                document.getElementById('line-img').src = lineProfile.pictureUrl;
                document.getElementById('line-name').innerText = lineProfile.displayName;

                await auth.signInAnonymously();
                
                const snap = await db.collection(COLLECTION)
                    .where("lineUid", "==", lineProfile.userId).limit(1).get();

                if (!snap.empty) {
                    const doc = snap.docs[0];
                    currentUserData = { id: doc.id, ...doc.data() };
                    renderMainView();
                } else {
                    showView('view-login');
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบได้', 'error');
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
            }
        };

        function renderSizeGrids() {
            const shirtGrid = document.getElementById('shirt-options');
            const shoeGrid = document.getElementById('shoe-options');

            shirtGrid.innerHTML = '';
            SHIRT_DATA.forEach(s => {
                shirtGrid.innerHTML += `
                    <button onclick="selectSize('shirt', '${s.l}')" class="size-opt-shirt p-2 rounded-xl border-2 border-gray-50 bg-gray-50 text-center hover:border-blue-200 transition-all">
                        <div class="font-bold text-xs">${s.l}</div>
                        <div class="text-[9px] text-gray-400">${s.c}"</div>
                    </button>`;
            });

            shoeGrid.innerHTML = '';
            for (let i = 36; i <= 48; i++) {
                shoeGrid.innerHTML += `
                    <button onclick="selectSize('shoe', '${i}')" class="size-opt-shoe p-2 rounded-xl border-2 border-gray-50 bg-gray-50 font-bold text-xs hover:border-blue-200 transition-all">
                        ${i}
                    </button>`;
            }
        }

        async function handleVerify() {
            const idInput = document.getElementById('login-id').value.trim();
            const id = idInput.padStart(7, '0');
            
            if (id === '0000000' || idInput === '') return Swal.fire('ข้อมูลไม่ถูกต้อง', 'กรุณาระบุรหัสพนักงาน', 'warning');

            showProgress();
            try {
                const docRef = db.collection(COLLECTION).doc(id);
                const doc = await docRef.get();

                if (!doc.exists) {
                    hideProgress();
                    return Swal.fire('ไม่พบรหัสพนักงาน', 'กรุณาตรวจสอบรหัสพนักงานอีกครั้ง หากเพิ่งเริ่มงานกรุณาติดต่อ HR', 'error');
                }

                const data = doc.data();

                if (data.lineUid && data.lineUid !== lineProfile.userId) {
                    hideProgress();
                    return Swal.fire('ไม่สามารถใช้รหัสนี้ได้', 'รหัสพนักงานนี้ถูกลงทะเบียนโดยบัญชี LINE อื่นแล้ว หากนี่คือรหัสของคุณ กรุณาติดต่อ Admin', 'warning');
                }

                Swal.fire({
                    title: 'ยืนยันข้อมูลพนักงาน',
                    html: `<div class="text-left text-sm p-4 bg-gray-50 rounded-2xl">
                            <b>ชื่อ:</b> ${data.name}<br>
                            <b>แผนก:</b> ${data.dept}
                           </div>`,
                    showCancelButton: true,
                    confirmButtonText: 'ยืนยันข้อมูลถูกต้อง',
                    confirmButtonColor: '#007EB3'
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        await docRef.update({
                            lineUid: lineProfile.userId,
                            lineName: lineProfile.displayName,
                            lastActive: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        currentUserData = { id, ...data };
                        renderMainView();
                    }
                });
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            } finally {
                hideProgress();
            }
        }

        function renderMainView() {
            showView('view-main');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = currentUserData.name;
            document.getElementById('user-display-dept').innerText = `${currentUserData.id} | ${currentUserData.dept || 'N/A'}`;
            
            if (currentUserData.role === 'SuperUser') {
                document.getElementById('admin-tabs').classList.remove('hidden');
            }

            if (currentUserData.shirtSize) selectSize('shirt', currentUserData.shirtSize);
            if (currentUserData.shoeSize) selectSize('shoe', currentUserData.shoeSize);
        }

        function selectSize(type, size) {
            selectedSizes[type] = size;
            const className = type === 'shirt' ? '.size-opt-shirt' : '.size-opt-shoe';
            const btns = document.querySelectorAll(className);
            btns.forEach(btn => {
                if (btn.innerText.includes(size)) btn.classList.add('size-btn-active');
                else btn.classList.remove('size-btn-active');
            });
        }

        async function saveRegistration() {
            if (!selectedSizes.shirt || !selectedSizes.shoe) {
                return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาเลือกไซส์เสื้อและรองเท้าให้ครบถ้วน', 'warning');
            }

            showProgress();
            try {
                await db.collection(COLLECTION).doc(currentUserData.id).update({
                    shirtSize: selectedSizes.shirt,
                    shoeSize: selectedSizes.shoe,
                    registrationDate: firebase.firestore.FieldValue.serverTimestamp()
                });
                Swal.fire({
                    icon: 'success',
                    title: 'บันทึกสำเร็จ',
                    text: 'ข้อมูลการลงทะเบียนของคุณถูกส่งเข้าระบบแล้ว',
                    timer: 2000,
                    showConfirmButton: false
                });
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            } finally {
                hideProgress();
            }
        }

        function logout() {
            Swal.fire({
                title: 'ออกจากหน้าจอ?',
                text: "ระบบจะปิดหน้าต่างนี้ลง",
                showCancelButton: true,
                confirmButtonText: 'ตกลง'
            }).then((res) => {
                if (res.isConfirmed) {
                    liff.closeWindow();
                }
            });
        }

        function showView(id) {
            ['view-login', 'view-main'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function switchTab(tab) {
            document.getElementById('section-registration').classList.toggle('hidden', tab !== 'registration');
            document.getElementById('section-admin').classList.toggle('hidden', tab !== 'import');
            document.getElementById('tab-registration').className = tab === 'registration' ? 'pb-3 font-bold transition-all tab-active' : 'pb-3 font-bold text-gray-400';
            document.getElementById('tab-import').className = tab === 'import' ? 'pb-3 font-bold transition-all tab-active' : 'pb-3 font-bold text-gray-400 text-xs';
        }

        async function startImport() {
            const input = document.getElementById('json-input').value.trim();
            if (!input) return;
            try {
                const data = JSON.parse(input);
                showProgress();
                let count = 0;
                for (const item of data) {
                    const id = String(item.id).padStart(7, '0');
                    await db.collection(COLLECTION).doc(id).set(item, { merge: true });
                    count++;
                }
                Swal.fire('สำเร็จ', `อัปเดตข้อมูลพนักงาน ${count} รายการเรียบร้อยแล้ว`, 'success');
                document.getElementById('json-input').value = '';
            } catch (e) {
                Swal.fire('JSON Error', 'รูปแบบข้อมูลไม่ถูกต้อง กรุณาตรวจสอบวงเล็บและเครื่องหมายคำพูด', 'error');
            } finally { hideProgress(); }
        }

        async function exportData() {
            showProgress();
            try {
                const snap = await db.collection(COLLECTION).get();
                const data = snap.docs.map(doc => ({
                    EmployeeID: doc.id,
                    ...doc.data(),
                    registrationDate: doc.data().registrationDate ? doc.data().registrationDate.toDate().toLocaleString('th-TH') : '',
                    lastActive: doc.data().lastActive ? doc.data().lastActive.toDate().toLocaleString('th-TH') : ''
                }));

                const worksheet = XLSX.utils.json_to_sheet(data);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "EmployeeData");
                
                const fileName = `Maersk_Registration_${new Date().toISOString().split('T')[0]}.xlsx`;
                XLSX.writeFile(workbook, fileName);
            } catch (err) {
                Swal.fire('Export Error', err.message, 'error');
            } finally {
                hideProgress();
            }
        }

        function showProgress() { document.getElementById('progress-container').classList.remove('hidden'); }
        function hideProgress() { document.getElementById('progress-container').classList.add('hidden'); }
    </script>
</body>
</html>
